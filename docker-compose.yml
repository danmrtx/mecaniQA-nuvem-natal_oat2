services:
  mysql:
    build: ./mysql
    container_name: mecaniqa-mysql
    command: sh -c 'chown -R mysql:mysql /var/lib/mysql && mysqld_safe --bind-address=0.0.0.0'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - mecaniqa-net

  redis:
    build: ./redis
    container_name: mecaniqa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mecaniqa-net

  api:
    build: ./app-python
    container_name: mecaniqa-app
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    networks:
      - mecaniqa-net

  prometheus:
    image: prom/prometheus:latest
    container_name: mecaniqa-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./k8s/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    networks:
      - mecaniqa-net

  grafana:
    image: grafana/grafana:latest
    container_name: mecaniqa-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - prometheus
    networks:
      - mecaniqa-net

networks:
  mecaniqa-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data: