apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    rule_files:
      - /etc/prometheus/alert_rules.yml

    scrape_configs:
      - job_name: 'mecaniqa-iot-api'
        scrape_interval: 5s
        metrics_path: '/metrics'
        static_configs:
          - targets: ['mecaniqa-app.default.svc.cluster.local:8080']
            labels:
              app: 'mecaniqa-app'
              environment: 'production'

      - job_name: 'prometheus'
        scrape_interval: 5s
        static_configs:
          - targets: ['localhost:9090']

  alert_rules.yml: |
    groups:
      - name: mecaniqa_alerts
        rules:
          # 1. Alarme Infraestrutura: CPU Alta
          - alert: HighCPUUsageInfra
            expr: sum(rate(process_cpu_seconds_total{job="mecaniqa-iot-api"}[1m])) * 100 > 75
            for: 15s
            labels:
              severity: critical
              category: infrastructure
            annotations:
              summary: "Uso elevado de CPU detectado na aplicação MecâniQA"
              description: "A utilização de CPU excedeu 75% da capacidade por mais de 15 segundos."

          # 2. Alarme Infraestrutura: Memória Alta
          - alert: HighMemoryUsageInfra
            expr: sum(process_resident_memory_bytes{job="mecaniqa-iot-api"}) / (1024 * 1024) > 150
            for: 15s
            labels:
              severity: warning
              category: infrastructure
            annotations:
              summary: "Consumo excessivo de Memória RAM na aplicação MecâniQA"
              description: "O uso de memória RAM ultrapassou 150MB por mais de 15 segundos."

          # 3. Alarme Customizado Aplicação: Alta Taxa de Erros
          - alert: HighApplicationErrorRate
            expr: sum(rate(mecaniqa_sensor_readings_error_total[1m])) > 1 or (sum(rate(mecaniqa_requests_total{status=~"5.."}[1m])) / (sum(rate(mecaniqa_requests_total[1m])) > 0)) * 100 > 5
            for: 10s
            labels:
              severity: critical
              category: application
            annotations:
              summary: "Pico de erros na ingestão de telemetria IoT"
              description: "Taxa de erro da aplicação ultrapassou 5% ou mais de 1 falha/segundo."

          # 4. Alarme Customizado Aplicação: Anomalias Críticas de Sensores (Superaquecimento)
          - alert: IoTOverheatAnomalySpike
            expr: sum(rate(mecaniqa_engine_overheat_alerts_total[1m])) > 0.05
            for: 10s
            labels:
              severity: critical
              category: iot_business
            annotations:
              summary: "Surto crítico de superaquecimento de motores de clientes"
              description: "Sensores IoT detectaram múltiplos motores acima de 105°C nos veículos das oficinas."
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mecaniqa-prometheus
  namespace: monitoring
  labels:
    app: mecaniqa-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mecaniqa-prometheus
  template:
    metadata:
      labels:
        app: mecaniqa-prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
          ports:
            - containerPort: 9090
              name: web
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: mecaniqa-prometheus
  namespace: monitoring
  labels:
    app: mecaniqa-prometheus
spec:
  type: LoadBalancer
  selector:
    app: mecaniqa-prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
